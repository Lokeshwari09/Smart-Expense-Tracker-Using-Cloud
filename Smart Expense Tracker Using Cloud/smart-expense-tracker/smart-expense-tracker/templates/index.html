<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Expense Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header>
    <h1>Smart Expense Tracker</h1>
    <p>Cloud-based personal finance dashboard</p>
  </header>

  <main>
    <section class="cards">
      <div class="card"><span>Spent this month</span><strong id="total">₹0</strong></div>
      <div class="card"><span>Budget</span><strong id="budget">₹0</strong></div>
      <div class="card"><span>Forecast (month end)</span><strong id="forecast">₹0</strong></div>
      <div class="card"><span>Budget used</span><strong id="percent">0%</strong></div>
    </section>

    <div id="alert" class="alert">Loading...</div>

    <section class="grid">
      <form id="expense-form" class="panel">
        <h2>Add expense</h2>
        <input id="description" placeholder="Description (e.g. Swiggy dinner)" required>
        <input id="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
        <select id="category">
          <option value="">Auto-detect category</option>
          {% for c in categories %}<option>{{ c }}</option>{% endfor %}
        </select>
        <input id="spent_on" type="date" value="{{ today }}">
        <button type="submit">Add</button>
        <hr>
        <h2>Monthly budget</h2>
        <input id="budget-input" type="number" min="1" placeholder="New budget">
        <button type="button" id="set-budget">Update budget</button>
        <hr>
        <a class="link" href="/api/export.csv">Download CSV</a>
        <button type="button" id="backup" class="secondary">Backup to AWS S3</button>
        <small id="backup-msg"></small>
      </form>

      <div class="panel"><h2>By category</h2><canvas id="pie"></canvas></div>
      <div class="panel"><h2>Daily spending</h2><canvas id="bar"></canvas></div>
    </section>

    <section class="panel">
      <h2>Recent expenses</h2>
      <table>
        <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
